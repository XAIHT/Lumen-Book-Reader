[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-epub-reader"
version = "1.1.0"
description = "A polished, secure desktop EPUB and PDF reader built with Python and Qt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PySide6>=6.7,<7",
  "beautifulsoup4>=4.12,<5",
  "nltk>=3.9,<4",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pypdf>=6,<7", "reportlab>=4,<5"]

[project.gui-scripts]
lumen-reader = "lumen_reader.app:main"

[tool.setuptools.packages.find]
include = ["lumen_reader*"]

[tool.setuptools.package-data]
lumen_reader = ["assets/*.ico", "assets/*.png", "assets/nltk_data/corpora/*.zip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
